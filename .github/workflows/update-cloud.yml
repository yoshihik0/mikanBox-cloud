name: Update mikanBox Cloud
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-mikanbox-cloud
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find latest published Cloud release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(gh api repos/yoshihik0/mikanBox-cloud/releases --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: yoshihik0/mikanBox-cloud
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Update existing installation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIKANBOX_UPDATE_CONFIG: ${{ secrets.MIKANBOX_UPDATE_CONFIG }}
          MIKANBOX_UPDATE_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-cloud.mjs
