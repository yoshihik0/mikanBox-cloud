name: Update mikanBox Cloud
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-mikanbox-cloud
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The release is chosen by its tag, but everything below runs the commit that tag pointed to
      # when it was resolved here (as the PHP updater does): moving the tag later changes nothing.
      - name: Find latest published Cloud release and its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/yoshihik0/mikanBox-cloud/releases --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No published release found."; exit 1; }
          sha=$(gh api "repos/yoshihik0/mikanBox-cloud/commits/$tag" --jq '.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve the commit of $tag."; exit 1; }
          echo "Release $tag is commit $sha."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Actions pinned to the commits of their official releases (checked with the GitHub API).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yoshihik0/mikanBox-cloud
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          [ "$head" = "$EXPECTED_SHA" ] || { echo "Checked out $head, expected $EXPECTED_SHA. Update stopped."; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$RELEASE_TAG" ] || { echo "package.json says $version, release is $RELEASE_TAG. Update stopped."; exit 1; }
          echo "Running $RELEASE_TAG at $head."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Update existing installation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIKANBOX_UPDATE_CONFIG: ${{ secrets.MIKANBOX_UPDATE_CONFIG }}
          MIKANBOX_UPDATE_REPOSITORY: ${{ github.repository }}
          MIKANBOX_UPDATE_COMMIT: ${{ steps.release.outputs.sha }}
        run: node scripts/update-cloud.mjs
